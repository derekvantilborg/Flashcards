<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mots">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <title>Mots</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="stats">
    <span id="learned"></span>
    <span class="right">
      <span id="today"></span>
      <button class="gear" id="gear" aria-label="Settings">⚙︎</button>
    </span>
  </header>

  <main class="stage">
    <div class="card" id="card">
      <div class="inner" id="inner">
        <div class="face front">
          <span class="badge">new</span>
          <div class="en" id="en"></div>
          <div class="nl" id="nl"></div>
          <span class="tag" id="tag-front"></span>
        </div>
        <div class="face back">
          <div class="fr" id="fr"></div>
          <div class="back-hint" id="back-hint"></div>
          <button class="speak" id="speak" aria-label="Pronounce">🔊</button>
          <span class="tag" id="tag-back"></span>
        </div>
      </div>
      <div class="stamp yes">✓</div>
      <div class="stamp no">✗</div>
    </div>
  </main>

  <footer>
    <p class="hint" id="hint"></p>
    <div class="buttons">
      <button id="btn-no" aria-label="Wrong">✗</button>
      <button id="btn-yes" aria-label="Correct">✓</button>
    </div>
  </footer>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-label="Settings">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button id="sheet-done">Done</button>
      </div>

      <h3>Focus</h3>
      <div class="group">
        <label class="row"><span>Position &amp; time words <small>on, under, before, after, besides…</small></span><input type="checkbox" data-key="focusPrep"><i class="switch"></i></label>
        <label class="row"><span>Core verbs <small>the 25 most common, with conjugations</small></span><input type="checkbox" data-key="focusCore"><i class="switch"></i></label>
        <label class="row"><span>Top 100 verbs <small>with conjugations</small></span><input type="checkbox" data-key="focusTop100"><i class="switch"></i></label>
      </div>
      <p class="focus-note">Turn one or more on to study only those cards.</p>

      <h3>Words</h3>
      <div class="group" id="word-types">
        <label class="row type-row"><span>Nouns</span><input type="checkbox" data-key="noun"><i class="switch"></i></label>
        <label class="row type-row"><span>Verbs</span><input type="checkbox" data-key="verb"><i class="switch"></i></label>
        <div class="tenses" id="tenses">
          <p class="note">Conjugations · unlock once you know a verb; new verbs wait until they’re solid</p>
          <label class="row sub"><span>Present</span><input type="checkbox" data-key="pres"><i class="switch"></i></label>
          <label class="row sub"><span>Passé composé</span><input type="checkbox" data-key="pc"><i class="switch"></i></label>
          <label class="row sub"><span>Futur simple</span><input type="checkbox" data-key="fut"><i class="switch"></i></label>
        </div>
        <label class="row type-row"><span>Adjectives</span><input type="checkbox" data-key="adj"><i class="switch"></i></label>
        <label class="row type-row"><span>Other <small>adverbs, phrases, numbers</small></span><input type="checkbox" data-key="other"><i class="switch"></i></label>
      </div>

      <h3>Sound</h3>
      <div class="group">
        <label class="row"><span>Sound effects</span><input type="checkbox" data-key="sound"><i class="switch"></i></label>
        <label class="row"><span>Pronounce when flipping <small>reads the French aloud as the card turns</small></span><input type="checkbox" data-key="autoSpeak"><i class="switch"></i></label>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
